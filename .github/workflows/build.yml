name: build

# 构建「jellyfin-ffmpeg + bytevc2 解码器」。
#
# 为什么用 patch 而不是 fork 整个 FFmpeg：
#   bvc2 的改动只有 ~107 行 / 15 个文件，主体是复用上游已有的 vvc 解码器。
#   fork 的话要背着 FFmpeg 的完整历史，上游升级靠 merge（冲突容易静默错位）；
#   patch 的话升级只需改 UPSTREAM_COMMIT，patch 对不上会**立刻失败**——
#   这正是我们要的：宁可构建红，也不要静默产出没有 bvc2 的二进制。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: '覆盖 UPSTREAM_COMMIT（留空用文件里的）'
        required: false
        default: ''

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/jellyfin/jellyfin-ffmpeg.git
  UPSTREAM_BRANCH: jellyfin
  # nv-codec-headers 钉在 NVENC API 13.0（Video Codec SDK 13.0）。
  # 不用 master：master 是 13.1，编出的 ffmpeg 在驱动 < 610 的机器上会
  # 报 "Driver does not support the required nvenc API version. Required: 13.1 Found: 13.0"，
  # 并被编码器探测吞掉、静默退化成软编（本机 Quadro P620 + 驱动 572.83 实测）。
  # 13.0 = 570 系列驱动即可，覆盖面更广。
  #   验证方式: sed -n 's/^#define NVENCAPI_MINOR_VERSION \(.*\)/\1/p' include/ffnvcodec/nvEncodeAPI.h
  NV_CODEC_HEADERS_COMMIT: f2fb9b36d5e08d6211f7cf6377971c0570939e65

jobs:
  # 先做纯文本校验：几十秒内暴露 patch 与上游错位，不必等 1-2 小时的编译。
  verify:
    name: Verify patch applies
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned commit
        id: pin
        run: |
          set -euo pipefail
          commit="${{ inputs.upstream_commit }}"
          if [ -z "$commit" ]; then
            commit="$(tr -d '[:space:]' < UPSTREAM_COMMIT)"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "上游提交: $commit"

      - name: Prepare sources
        env:
          UPSTREAM_COMMIT_OVERRIDE: ${{ steps.pin.outputs.commit }}
        run: bash scripts/prepare.sh "$RUNNER_TEMP/src"

  build-linux:
    name: Linux x86_64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare sources
        # 各构建 job 自己跑 prepare.sh，而不是从 verify 传 artifact：
        # upload-artifact 会把 zip 解成 644，configure/ffbuild/*.sh 全部丢掉执行位，
        # 结果是 make 报 Error 126（实测踩到两次）。git clone 能保住 mode 位。
        env:
          UPSTREAM_COMMIT_OVERRIDE: ${{ needs.verify.outputs.commit }}
        run: bash scripts/prepare.sh "$RUNNER_TEMP/src"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential yasm nasm pkg-config libx264-dev

      - name: Install ffnvcodec headers
        # 只有头文件（没有运行时依赖），让 configure 能开 nvenc。
        # 硬件编码是关键：libx264 软编 1080p 约 0.5x 实时，NVENC 约 11x。
        # 装到 /usr：configure 的 --enable-ffnvcodec 走 pkg-config，装到临时前缀它找不到。
        #
        # ⚠️ 必须钉版本，不能用 master。master 是 NVENC API 13.1，编出的 ffmpeg 在
        # 驱动 < 610 的机器上会失败（实测 572.83 报 "Required: 13.1 Found: 13.0"），
        # 而且失败会被编码器探测吞掉、静默退化成软编。13.0 对应 570 系列驱动。
        run: |
          set -euo pipefail
          git clone https://github.com/FFmpeg/nv-codec-headers.git "$RUNNER_TEMP/nv-codec-headers"
          git -C "$RUNNER_TEMP/nv-codec-headers" checkout "$NV_CODEC_HEADERS_COMMIT"
          sudo make -C "$RUNNER_TEMP/nv-codec-headers" install PREFIX=/usr

      - name: Build
        run: bash scripts/build.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/dist"

      - name: Package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tar -cJf "ffmpeg-bvc2-linux64-$GITHUB_SHA.tar.xz" -C dist .
          sha256sum ffmpeg-bvc2-linux64-*.tar.xz | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux64
          path: |
            ${{ runner.temp }}/ffmpeg-bvc2-linux64-*.tar.xz
          retention-days: 30

  # Windows 是主要使用场景：ShortTV 跑在 Windows 上，需要 ffmpeg.exe。
  build-windows:
    name: Windows x86_64
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # ── MSYS2：直接用 runner 预装的 C:\msys64，不下载 ──────────────────
      # GitHub 的 Windows runner 镜像自带 MSYS2（runner-images 的 Readme：
      #   "MSYS2 / Pacman 6.1.0 / Location: C:\msys64 / pre-installed but not added to PATH"）。
      # setup-msys2 的 `release: false` 就是「用这个预装安装」，不再去
      # GitHub Releases 拉基础包 —— 之前连续 503/504 全卡在 "Downloading MSYS2..."，
      # 这一步直接把失败源去掉，也不需要重试和清理半成品目录了。
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false
          # update:false —— 完整 pacman -Syu 要轮询全部镜像，实测易超时；
          # 构建并不需要系统最新。
          update: false
          # 也**不在这里装包**：装包失败要能重试，而 `uses:` 步骤无法重试。
          # 包里也不要 mingw-w64-clang-x86_64-toolchain 这个组 —— 它会拖进
          # 189 个包（含 ffmpeg / SDL2 / llama.cpp），既慢又极易超时。
          # 真正需要的只有 clang + lld + nasm + pkgconf + x264，下面单独装。
          install: ''

      - name: Install build toolchain (with retry)
        run: |
          set -uo pipefail
          pkgs="make diffutils git \
            mingw-w64-clang-x86_64-clang \
            mingw-w64-clang-x86_64-lld \
            mingw-w64-clang-x86_64-nasm \
            mingw-w64-clang-x86_64-pkgconf \
            mingw-w64-clang-x86_64-x264"
          # --disable-download-timeout 是关键：镜像偶尔慢到
          # "Less than 1 bytes/sec transferred the last 10 seconds" 就整个事务失败。
          # 加上它 + 三次重试，把镜像抖动变成可恢复。
          # -Sy 先同步软件包数据库：runner 预装的 MSYS2 数据库可能是旧的/缺的，
          # 不同步会报 "target not found"。
          for attempt in 1 2 3; do
            echo "=== pacman 安装（第 $attempt 次） ==="
            if pacman -Sy --noconfirm --disable-download-timeout && \
               pacman -S --needed --noconfirm --disable-download-timeout $pkgs; then
              echo "安装成功"
              exit 0
            fi
            echo "第 $attempt 次失败，10 秒后重试"
            sleep 10
          done
          echo "::error::pacman 连续三次安装失败（MSYS2 镜像问题）"
          exit 1

      - name: Prepare sources
        env:
          UPSTREAM_REPO: https://github.com/jellyfin/jellyfin-ffmpeg.git
          UPSTREAM_BRANCH: jellyfin
          UPSTREAM_COMMIT_OVERRIDE: ${{ needs.verify.outputs.commit }}
        run: |
          # $RUNNER_TEMP 在 MSYS2 里是 `D:\a\_temp` 这种 Windows 路径，
          # 直接传给 bash 的 cd 会失败（实测 "No such file or directory"）。
          # 用 cygpath 转成 POSIX 形式。
          work="$(cygpath -u "$RUNNER_TEMP")"
          bash scripts/prepare.sh "$work/src"

      - name: Build
        run: |
          set -euo pipefail
          work="$(cygpath -u "$RUNNER_TEMP")"
          # ffnvcodec: 头文件装到 CLANG64 前缀，build.sh 会去那找。
          # 同样钉 commit 不用 master（理由见 job 级 env 里的说明）。
          git clone https://github.com/FFmpeg/nv-codec-headers.git "$work/nv-codec-headers"
          git -C "$work/nv-codec-headers" checkout "$NV_CODEC_HEADERS_COMMIT"
          make -C "$work/nv-codec-headers" install PREFIX=/clang64
          bash scripts/build.sh "$work/src" "$work/dist"

      - name: Package
        run: |
          set -euo pipefail
          work="$(cygpath -u "$RUNNER_TEMP")"
          cd "$work"
          # 用 tar 而不是 7z：精简包集后没有 p7zip（原先由 toolchain 组间接带入），
          # 而 tar 是 MSYS2 基础包自带。zip 格式对使用者更顺手，但 Windows 10+
          # 资源管理器原生就能开 .tar.xz，且与 Linux 产物格式统一。
          tar -cJf "ffmpeg-bvc2-win64-${GITHUB_SHA}.tar.xz" -C dist .
          sha256sum ffmpeg-bvc2-win64-*.tar.xz | tee SHA256SUMS-win.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64
          path: |
            ${{ runner.temp }}/ffmpeg-bvc2-win64-*.tar.xz
          retention-days: 30

  release:
    name: Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            基于 jellyfin-ffmpeg `${{ needs.verify.outputs.commit }}` 构建，附加 bytevc2 解码器。

            - 产物含 `bvc2` 解码器（`ffmpeg -decoders | grep bvc2` 可验）
            - patch 见仓库 `patches/`，上游升级只需改 `UPSTREAM_COMMIT`
